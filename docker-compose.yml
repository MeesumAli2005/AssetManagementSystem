services:
  client:
    build: ./client
    ports:
      - "5173:4173"

    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "5000:5000"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: asset_management
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      - mysql

  mysql:
    image: mysql:lts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: asset_management

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/asset_management.sql:/docker-entrypoint-initdb.d/asset_management.sql:ro

    ports:
      - "3307:3306"

volumes:
  mysql-data:
