tags:
  name: Auth
  description: Login, logout, and password change
/api/auth/login:
  post:
    summary: Log in and receive a JWT
    tags:
      - Auth
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      "200":
        description: Login successful
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResponse"
      "401":
        description: Invalid email or password
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "403":
        description: Account is deactivated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
/api/auth/logout:
  post:
    summary: Log out (client discards the token — this call is mainly for logging)
    tags:
      - Auth
    responses:
      "200":
        description: Logged out
      "401":
        description: No or invalid token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
/api/auth/change-password:
  post:
    summary: Change your own password
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - current_password
              - new_password
              - confirm_password
            properties:
              current_password:
                type: string
                format: password
              new_password:
                type: string
                format: password
              confirm_password:
                type: string
                format: password
    responses:
      "200":
        description: Password changed
      "400":
        description: Missing fields or new/confirm mismatch
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      "401":
        description: No/invalid token
        or current_password is wrong: null
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
